[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revguard"
version = "0.1.0"
description = "RevGuard — AI-powered, policy-controlled revenue recovery agent"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "RevGuard Team" }]

# Runtime dependencies. (anthropic, razorpay, fastapi/httpx, typer are added in their
# own phases.) SQLAlchemy added in Phase 3 for SQLite persistence + append-only audit log.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.5,<1",
]
# Optional: enables the AnthropicProvider. The app runs fully offline on MockDiagnoser
# without this installed; the SDK is imported lazily only when a real client is created.
anthropic = [
    "anthropic>=0.40,<1",
]
# Optional: enables the GeminiProvider. The app runs fully offline on MockDiagnoser
# without this installed; the SDK is imported lazily only when a real client is created.
gemini = [
    "google-genai>=1.0,<2",
]
# Optional: enables the GroqProvider (Llama 3.3 — the production default). Imported lazily;
# the app runs fully offline on MockDiagnoser without this installed.
groq = [
    "groq>=0.11,<1",
]
# Optional: enables Razorpay Test Mode execution/verification. Imported lazily; the app runs
# fully offline on MockAdapter without this installed. ``setuptools`` is pinned in because the
# razorpay 1.4.x SDK imports ``pkg_resources`` at import time, which is no longer bundled with
# Python 3.12+ virtualenvs — without it the client factory fails with a misleading error.
razorpay = [
    "razorpay>=1.4,<2",
    "setuptools>=68",
]
# Optional: enables the FastAPI webhook endpoint. Imported lazily; the core engine and its
# tests never require it.
api = [
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
revguard = "revguard.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/revguard"]

[tool.pytest.ini_options]
# Lets the test suite import the package from src/ without an editable install,
# so Phase 0 is verifiable even when only Python 3.14 is present on the machine.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated as argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Security",
]
