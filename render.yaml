# Render Blueprint — deploys the RevGuard FastAPI backend.
#
# Deploy: Render Dashboard → New → Blueprint → connect the aman462006/RevGuard repo →
# Apply. Then set the `sync: false` env vars in the dashboard (the CORS origin, and the API
# keys if you switch to production mode). See DEPLOYMENT.md for the full runbook.

services:
  - type: web
    name: revguard-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install ".[api,groq,razorpay]"
    startCommand: uvicorn revguard.api.app:create_api_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Pin Python (the project requires >=3.12,<3.14).
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Production uses Groq (Llama 3.3) for diagnosis and Razorpay Test Mode for bounded
      # execution. Set this to "demo" only for a credential-free rehearsal.
      - key: REVGUARD_MODE
        value: production
      # SQLite on the instance disk (ephemeral on free — resets on redeploy; fine for a demo).
      # For persistence, point this at a managed Postgres URL instead.
      - key: REVGUARD_DATABASE_URL
        value: "sqlite:///./revguard.db"
      # After deploying the frontend, set this to your Vercel origin as a JSON list, e.g.
      #   ["https://revguard.vercel.app"]
      - key: REVGUARD_CORS_ALLOW_ORIGINS
        sync: false
      # --- Required when REVGUARD_MODE=production ---
      - key: REVGUARD_AI_PROVIDER
        value: groq
      # Must be a *currently available* Groq model that supports json_object response format
      # (RevGuard's GroqProvider requires it). llama-3.3-70b-versatile was decommissioned by
      # Groq; qwen3.8-27b is available and returns clean JSON. Check https://console.groq.com
      # /docs/models if this ever 404s again.
      - key: REVGUARD_AI_MODEL
        value: qwen/qwen3.8-27b
      # Groq credential — paste the value in the Render dashboard, never commit it here.
      - key: GROQ_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
